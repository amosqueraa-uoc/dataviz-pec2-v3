<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en">
    <head>
    <title>PEC 2 Hyperbolic tree</title>
    <meta charset="UTF-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="dcterms.rightsHolder" content="Andrea Mosquera © 2026 - Based on d3.hypertree: Copyright © 2018 Glatzhofer Michael">
    
    <link rel="stylesheet" href="d3-hypertree-light.css" id="ldswitch">        

    <script src="d3-hypertree.js"></script>
    </head>
    <body>
        <div>
            <h1>Título de la visualización</h1>
            <h2> Visualización de Datos / PEC 2 / Tercera práctica: Hypertree </h2>
            <p> Descripción de la visualización </p>
        </div>
        <div>
            <p id=tree-holder>
                <script>
                    const placeholder = document.getElementByID('tree-holder);
                    const ht = new hyt.Hypertree(
                        {
                            parent: placeholder             
                        },
                        {
                            dataloader: hyt.loaders.fromFile('mammalia.d3.json'),
                            langInitBFS: (ht, n)=> n.precalc.label = n.data.name,
                        }
                    )
                    ht.initPromise
                        .then(()=> new Promise((ok, err)=> ht.animateUp(ok, err)))            
                        .then(()=> ht.drawDetailFrame())
                </script>
            </p>
        </div>
    </body>
</html>
